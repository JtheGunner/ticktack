name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Linux jobs (lint, test on ubuntu-latest, tidy) run on the self-hosted runner
# when the repository variable USE_LOCAL_RUNNER is "true" and the run is trusted:
# a push, or a pull request from a branch of this repository. Fork pull requests
# and every run with the variable unset or not "true" use GitHub-hosted
# ubuntu-latest. macOS jobs always stay on GitHub-hosted runners. The runs-on
# expression is repeated per job because workflow YAML has no shared variables.
# The condition only routes trusted runs; it is NOT a security boundary, because a
# pull request can edit this file. The real protection is server-side: the
# Actions setting that requires approval for all outside contributors, and an
# ephemeral runner without shared volumes (see the README).
jobs:
  lint:
    name: lint
    runs-on: ${{ (vars.USE_LOCAL_RUNNER == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","local","docker","debian"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.15.0

  # Separate job so the required check "lint" keeps its name. Linting on macOS
  # is the only way the darwin build-tagged files are ever analysed.
  lint-macos:
    name: lint-macos
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.15.0

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ (matrix.os == 'ubuntu-latest' && vars.USE_LOCAL_RUNNER == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","local","docker","debian"]') || matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      # The e2e test sits behind the "e2e" build tag and is never selected here.
      - run: make test
      # The race detector needs cgo, so this step runs with the default CGO setting.
      - run: go test -race ./...

  build:
    name: build
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make build

  tidy:
    name: tidy
    runs-on: ${{ (vars.USE_LOCAL_RUNNER == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","local","docker","debian"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy -diff
