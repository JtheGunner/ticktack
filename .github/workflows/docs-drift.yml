name: docs-drift

# Advisory only: reports code changes whose README section did not change as
# annotations and never fails (--warn-only). Do not add it to the required checks.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-drift-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-drift:
    name: docs-drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The tool needs the merge base, so a shallow clone is rejected.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      # Pinned version; bump it deliberately.
      - name: Install doc-drift-checker
        run: go install github.com/JtheGunner/doc-drift-checker/cmd/doc-drift-checker@v0.2.3
        env:
          GOBIN: ${{ runner.temp }}/bin
      - name: Check documentation drift
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          "${RUNNER_TEMP}/bin/doc-drift-checker" check --base "origin/${BASE_REF}" --format github --warn-only
