# ticktack example configuration.
#
# Copy this file to ~/.config/ticktack/config.toml (or
# $XDG_CONFIG_HOME/ticktack/config.toml). `ticktack init` creates a starting
# file for you. Every value below is the built-in default, so you only need to
# keep the lines you want to change.
#
# The YouTrack token is NOT stored here. It lives in the OS keychain; store it
# with `ticktack init`.

# Base URL of your YouTrack instance. Replace the placeholder.
youtrack_url = "https://example.youtrack.cloud"

# Presence gaps longer than this end a work block.
gap_threshold = "5m0s"

# Blocks shorter than this are dropped.
min_block_duration = "10m0s"

# Booked durations are rounded to a multiple of this.
rounding = "15m0s"

# Maximum time booked per day. A day above the cap needs an explicit
# acknowledgement in `ticktack review`.
daily_cap = "10h0m0s"

# Regular expression that extracts a ticket id from a branch name.
ticket_pattern = "[A-Z][A-Z0-9]+-\\d+"

# Repositories scanned for git history by `ticktack scan`. Each entry is the
# root of one repository (an absolute path or one starting with ~/); there is
# no recursive search. Only repo, branch, ticket hint and timestamp are stored.
# repo_paths = ["~/Projects/my-repo"]

# Folders whose direct subfolders are repositories (a subfolder with .git).
# Scanned like repo_paths; also used to match a repository folder to the
# YouTrack project of the same name (see "Standard tasks" in the README).
# repo_roots = ["~/Projects", "~/StudioProjects"]

# Standard task for time without a ticket: one catch-all issue in this project,
# and per matching project when repo_roots is set. Created by `ticktack sync`
# after one confirmation.
# [default_issue]
# project = "GENERAL"
# summary = "Meetings / Admin"

# Optional periodic git scan by the agent (off by default). "0" turns it off;
# otherwise the minimum is 5m. When set, the agent also scans once at start.
# [scan]
# interval = "0"

# Time zone for day boundaries (default: the system zone).
# time_zone = "Europe/Zurich"

# Fixed repository to ticket mappings. Repeat the table for more rules.
# [[rules]]
# repo = "/path/to/repo"
# ticket = "ABC-1"

# Optional window-title hints (off by default). Needs the macOS Accessibility
# permission. Titles are read in memory and never stored. Maps an IDE project
# name to the absolute path of its repository.
[titlehint]
enabled = false

# [titlehint.projects]
# "my-ide-project" = "/abs/path/to/repo"

# Optional import from a local ActivityWatch server (off by default). Only
# loopback addresses are accepted.
[activitywatch]
enabled = false
url = "http://localhost:5600"
# Restrict the import to buckets of this host (default: every host).
# hostname = "my-mac"

# Optional auto mode (off by default). `ticktack auto` books only explicit and
# rule blocks, and only after this many consecutive reviewed days without a
# correction.
[auto]
enabled = false
trusted_days = 10
