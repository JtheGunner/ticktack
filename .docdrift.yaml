# Configuration for doc-drift-checker, see .github/workflows/docs-drift.yml.
docs:
  - "README.md"
  - "docs/*.md"

# A present ignore key replaces the built-in list, so the defaults are repeated.
ignore:
  # tests
  - "**/*_test.go"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/test/**"
  - "**/tests/**"
  - "**/__tests__/**"
  - "**/testdata/**"
  # generated code
  - "**/*.pb.go"
  - "**/*_gen.go"
  - "**/*.generated.*"
  - "**/generated/**"
  - "**/*.min.js"
  # lockfiles
  - "**/go.sum"
  - "**/package-lock.json"
  - "**/yarn.lock"
  - "**/pnpm-lock.yaml"
  - "**/composer.lock"
  - "**/Cargo.lock"
  - "**/Gemfile.lock"
  - "**/poetry.lock"
  - "**/uv.lock"
  # vendored code
  - "**/vendor/**"
  - "**/node_modules/**"
  - "**/third_party/**"
  # project files that are not documented behaviour
  - "CHANGELOG.md"
  - "LICENSE"
  - "CONTRIBUTING.md"

mappings:
  # The path table lists whole directories, which would link every source file.
  "#-development":
    - "Makefile"
